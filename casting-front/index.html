<!doctype html>
<html lang="en" class="dark new-dark-cinema">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>casting-front</title>
    <script>
      var bootTheme = 'dark new-dark-cinema'
      try {
        var path = location.pathname
        if (path.startsWith('/admin')) bootTheme = 'admin-light'
        else if (/^\/(actor|director|casting-director)(\/|$)/.test(path)) bootTheme = localStorage.getItem('casting-app.theme') || bootTheme
      } catch {}
      document.documentElement.className = bootTheme
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
